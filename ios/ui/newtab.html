<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>New Tab</title>
<script>/*WISP_CFG*/</script>
<style>
:root{--accent:#5e5ce6;--fg:#fff;--glass:rgba(255,255,255,.12);--line:rgba(255,255,255,.18);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font:15px/1.35 var(--font,-apple-system,system-ui,sans-serif);color:var(--fg)}
body.f-rounded{--font:ui-rounded,-apple-system,sans-serif}body.f-serif{--font:ui-serif,Georgia,serif}body.f-mono{--font:ui-monospace,Menlo,monospace}
body.noclock .clock,body.noclock .hi,body.nodial .dial{display:none}
body.wl{--fg:#15131f;--glass:rgba(255,255,255,.6);--line:rgba(20,20,40,.1)}body.wd{--fg:#fff;--glass:rgba(255,255,255,.12);--line:rgba(255,255,255,.18)}
body.walled{background:var(--wall)!important;background-attachment:fixed!important}
body{background:radial-gradient(120% 80% at 15% 0%,#3b2a7a 0%,transparent 60%),radial-gradient(100% 70% at 100% 100%,#7a2a4f 0%,transparent 55%),#14121f;min-height:100vh;
 display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 11vh) 20px calc(env(safe-area-inset-bottom) + 120px)}
@media (prefers-color-scheme:light){:root{--fg:#15131f;--glass:rgba(255,255,255,.6);--line:rgba(20,20,40,.1);color-scheme:light}
 body{background:radial-gradient(120% 80% at 15% 0%,#d9d2ff 0%,transparent 60%),radial-gradient(100% 70% at 100% 100%,#ffd3e2 0%,transparent 55%),#f4f3f9}}
.clock{font-size:64px;font-weight:200;letter-spacing:-.02em;line-height:1}
.hi{margin-top:8px;font-size:18px;opacity:.85}
form{margin-top:30px;width:100%;max-width:520px;height:50px;border-radius:25px;background:var(--glass);border:1px solid var(--line);
 -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:flex;align-items:center;gap:10px;padding:0 18px}
form svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;opacity:.7;flex:none}
input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--fg);font:inherit;font-size:17px}
input::placeholder{color:var(--fg);opacity:.6}
.dial{margin-top:34px;display:grid;grid-template-columns:repeat(4,76px);gap:18px 10px;justify-content:center}
.dial a{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--fg);text-decoration:none;font-size:12px;min-width:0}
.dial a span{max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.dial i{width:60px;height:60px;border-radius:18px;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:24px;font-weight:700}
.dial a:active i{transform:scale(.94)}
</style></head><body>
<div class="clock" id="clock"></div>
<div class="hi" id="hi"></div>
<form id="f" action="#"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
 <input id="q" type="search" enterkeyhint="search" autocapitalize="off" autocorrect="off" placeholder="Search or enter address"></form>
<div class="dial">
 <a href="https://www.youtube.com/"><i style="color:#ff3b30">▶</i><span>YouTube</span></a>
 <a href="https://en.m.wikipedia.org/"><i>W</i><span>Wikipedia</span></a>
 <a href="https://www.reddit.com/"><i style="color:#ff5700">r</i><span>Reddit</span></a>
 <a href="https://github.com/"><i>⌘</i><span>GitHub</span></a>
 <a href="https://news.ycombinator.com/"><i style="color:#ff6600">Y</i><span>Hacker News</span></a>
 <a href="https://maps.google.com/"><i style="color:#34c759">⌖</i><span>Maps</span></a>
 <a href="https://duckduckgo.com/"><i style="color:#de5833">D</i><span>DuckDuckGo</span></a>
 <a href="https://www.bbc.com/news"><i>B</i><span>BBC News</span></a>
</div>
<script>
const pad=n=>String(n).padStart(2,'0');
function tick(){const d=new Date(),h=d.getHours();document.getElementById('clock').textContent=(h%12||12)+':'+pad(d.getMinutes());
 document.getElementById('hi').textContent=h<5?'Good night':h<12?'Good morning':h<18?'Good afternoon':'Good evening'}
// Look from Wisp (Settings → New Tab, font): set before first paint and updated live.
function wispCfg(c){if(!c)return;const b=document.body.classList;['rounded','serif','mono'].forEach(f=>b.toggle('f-'+f,c.font===f));
 b.toggle('noclock',c.clock===false);b.toggle('nodial',c.dial===false);b.toggle('walled',!!c.wall);
 if(c.wall)document.body.style.setProperty('--wall',c.wall);
 // Text colour follows the wallpaper's brightness (average of its colours).
 const hx=(c.wall||'').match(/#[0-9a-f]{6}/gi)||[];const L=hx.length?hx.reduce((a,h)=>{const n=parseInt(h.slice(1),16);return a+(.299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255))/255},0)/hx.length:-1;
 b.toggle('wl',L>.6);b.toggle('wd',L>=0&&L<=.6);if(c.accent)document.documentElement.style.setProperty('--accent',c.accent)}
wispCfg(window.WISP_CFG);
tick();
// Wakes once a minute, on the minute, and only while the page is visible.
let tm=0;const arm=()=>{clearTimeout(tm);if(!document.hidden)tm=setTimeout(()=>{tick();arm()},60000-Date.now()%60000)};arm();
document.addEventListener('visibilitychange',()=>{tick();arm()});
document.getElementById('f').onsubmit=e=>{e.preventDefault();const q=document.getElementById('q').value.trim();
 if(q)try{webkit.messageHandlers.wispPage.postMessage(JSON.stringify({t:'go',q}))}catch(_){}};
</script></body></html>
