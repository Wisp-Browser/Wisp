<style>
/* Wisp for iOS interface. Always full screen (touches outside the bar fall through to the page),
   on a system blur (UIVisualEffectView) that covers the bar, or the whole screen while a sheet is
   open. In the Flat style there is no blur and surfaces are solid. */
:root{--accent:#5e5ce6;--fg:#f2f2f7;--fg2:rgba(242,242,247,.68);--fg3:rgba(242,242,247,.45);--line:rgba(255,255,255,.1);
 --fill:rgba(255,255,255,.1);--fill2:rgba(255,255,255,.16);--card:rgba(40,40,52,.72);--tint:rgba(10,10,16,.35);
 --solid:#1c1c22;--ease:cubic-bezier(.16,.84,.44,1);--spring:cubic-bezier(.2,1.1,.3,1);--accent-fg:#fff;
 --font:-apple-system,system-ui,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--fg:#111118;--fg2:rgba(17,17,24,.66);--fg3:rgba(17,17,24,.45);--line:rgba(0,0,0,.09);
 --fill:rgba(0,0,0,.06);--fill2:rgba(0,0,0,.1);--card:rgba(255,255,255,.8);--tint:rgba(240,240,246,.3);--solid:#f4f4f7;color-scheme:light}}
body.f-rounded{--font:ui-rounded,-apple-system,system-ui,sans-serif}
body.f-serif{--font:ui-serif,"New York",Georgia,serif}
body.f-mono{--font:ui-monospace,Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:transparent;color:var(--fg);font:15px/1.3 var(--font);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
@media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important;transition-duration:1ms!important}}

/* ---------- bottom bar ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;height:calc(54px + env(safe-area-inset-bottom));padding:0 calc(8px + env(safe-area-inset-right)) env(safe-area-inset-bottom) calc(8px + env(safe-area-inset-left));
 display:flex;align-items:center;gap:4px;border-top:.5px solid var(--line);transition:opacity .2s var(--ease)}
body.top #bar{top:0;bottom:auto;height:calc(54px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);padding-bottom:0;border-top:0;border-bottom:.5px solid var(--line)}
body.flat #bar{background:var(--solid)}
/* Glass style: no strip, a floating row of glass pills over the page (the glass itself is native,
   drawn behind every .g element). */
body:not(.flat) #bar{left:calc(10px + env(safe-area-inset-left));right:calc(10px + env(safe-area-inset-right));bottom:max(calc(env(safe-area-inset-bottom) - 8px),10px);
 height:50px;padding:0;gap:8px;border:0}
body.top:not(.flat) #bar{top:calc(env(safe-area-inset-top) + 2px);bottom:auto;height:50px;padding:0}
body:not(.flat) #bar .ib{width:50px;height:50px;border-radius:25px}
body:not(.flat) #addr{height:50px;border-radius:25px;background:transparent}
body:not(.flat) #bar .ib:active,body:not(.flat) #addr:active{background:var(--fill)}
/* iOS 26: back, tabs and ⋯ are native Liquid Glass buttons drawn by iOS in these places. */
body.native #bar [data-btn]{visibility:hidden}
#prog{position:absolute;left:14px;right:14px;bottom:2px;height:2.5px;border-radius:2px;background:var(--accent);transform-origin:left;transform:scaleX(0);opacity:0;transition:transform .4s var(--ease),opacity .25s}
body.loading #prog{opacity:1;transform:scaleX(.85);transition:transform 6s cubic-bezier(.1,.6,.2,1),opacity .15s}
body.done #prog{opacity:0;transform:scaleX(1);transition:transform .2s var(--ease),opacity .3s .15s}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:22px;flex:none;color:var(--fg)}
.ib:active{background:var(--fill)}.ib:disabled{color:var(--fg3)}
#addr{flex:1;min-width:0;height:40px;border-radius:20px;background:var(--fill);overflow:hidden;display:flex;align-items:center;gap:6px;padding:0 14px;position:relative}
#addr .lock{width:13px;height:13px;stroke-width:2.2;color:var(--fg2);flex:none}
#url{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;color:var(--fg);font:inherit;font-size:15px;text-align:center;padding:0;-webkit-user-select:text;user-select:text;text-overflow:ellipsis}
#url::placeholder{color:var(--fg2)}
#rl{width:30px;height:30px;margin-right:-8px}
#count{width:24px;height:24px;border:1.8px solid currentColor;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700}

/* ---------- bookmarks bar (next to the address bar) ---------- */
#bm{position:fixed;display:none;align-items:center;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;transition:opacity .2s var(--ease);
 left:0;right:0;height:44px;padding:0 calc(8px + env(safe-area-inset-right)) 0 calc(8px + env(safe-area-inset-left));bottom:calc(54px + env(safe-area-inset-bottom));background:var(--solid);border-top:.5px solid var(--line)}
#bm::-webkit-scrollbar{display:none}
body.hasbm #bm{display:flex}body.full #bm{opacity:0;pointer-events:none}
body.top #bm{bottom:auto;top:calc(54px + env(safe-area-inset-top));border-top:0;border-bottom:.5px solid var(--line)}
body:not(.flat) #bm{left:calc(10px + env(safe-area-inset-left));right:calc(10px + env(safe-area-inset-right));height:36px;border-radius:18px;padding:0 6px;border:0;background:transparent;
 bottom:calc(max(calc(env(safe-area-inset-bottom) - 8px),10px) + 58px)}

/* ---------- full-screen sheets ---------- */
.sheet{position:fixed;inset:0;display:none;background:var(--tint);flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);z-index:2}
body.flat .sheet{background:var(--solid)}
body.full #bar{opacity:0;pointer-events:none}
.sheet.on{display:flex;animation:in .32s var(--spring)}
.sheet.out{display:flex;animation:out .16s var(--ease) forwards;pointer-events:none}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.985)}}
@keyframes out{to{opacity:0;transform:translateY(10px)}}
body.top .sheet.on{animation-name:intop}@keyframes intop{from{opacity:0;transform:translateY(-14px) scale(.985)}}
button{transition:transform .12s var(--ease),background-color .15s,opacity .15s}button:active{transform:scale(.96)}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px}
.top h2{flex:1;margin:0;font-size:17px;font-weight:600;text-align:center}
.txt{color:var(--accent);font-weight:600;font-size:16px;padding:8px 4px;min-width:64px}
.txt.l{text-align:left}.txt.r{text-align:right}

/* search */
#sbox{flex:1;height:42px;border-radius:21px;background:var(--fill);display:flex;align-items:center;gap:8px;padding:0 14px}
#sbox svg{width:17px;height:17px;color:var(--fg2)}

#grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:6px 16px 20px;align-content:start}

.card .hd b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .bd{flex:1;margin:0 8px 8px;border-radius:12px;background:var(--fill);display:grid;place-items:center;color:var(--fg3);font-size:34px;font-weight:700;text-transform:uppercase}

.seg{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--fill);margin:6px 14px}

.ph{height:120px;border-radius:12px;background:var(--fill);position:relative;overflow:hidden}
.ph i{position:absolute;left:8px;right:8px;height:12px;border-radius:6px;background:var(--fg3)}

/* first-run setup */
#setup .body{flex:1;overflow-y:auto;padding:14px 0 10px}

const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}};
const IC={x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>',
 globe:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',tab:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/></svg>',
 check:'<svg viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M5 12l5 5 9-10"/></svg>'};
let S={tabs:[],active:0,url:'',title:'',engines:[],engine:'ddg',blocker:true,set:{}},sheet='',wasLoading=false;

// ----- state from Wisp -----
window.wisp={state(s){S=s;render()}};
function render(){
 const b=document.body.classList,u=S.url||'';
 $('#url').value=u?host(u)||u:'';$('#lock').style.display=u.startsWith('https:')?'':'none';
 $('#count').textContent=S.tabs.length>99?':)':S.tabs.length;$('#back').disabled=!S.back;
 $('#rl').innerHTML=S.loading?'<svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M6 6l12 12M18 6L6 18"/></svg>':'<svg viewBox="0 0 24 24" style="width:17px;height:17px"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>';
 $('#rl').style.display=u?'':'none';
 if(S.loading&&!wasLoading){b.remove('done');b.add('loading')}
 if(!S.loading&&wasLoading){b.remove('loading');b.add('done')}
 wasLoading=S.loading;
 $('#mback').disabled=!S.back;$('#mfwd').disabled=!S.fwd;
 $('#mdeskt').textContent=S.desktop?'Request mobile site':'Request desktop site';
 $('#blocksw').classList.toggle('on',!!S.blocker);
 applyLook();renderBm();
 if(S.set&&!S.set.setup_done&&!suAuto){suAuto=true;su=0;open('setup');return}
 if(sheet==='tabs')renderTabs();if(sheet==='search')renderSugg();if(sheet==='set')renderSet();
}

// ----- sheets (full screen) -----
// Sheets: the glass grows natively while the sheet springs in; on close the bar is back at once
// (the interface never resizes) and the sheet fades out over it.
function open(name){sheet=name;document.body.classList.add('full');send({t:'mode',full:true,blur:name!=='menu'});
 document.querySelectorAll('.sheet').forEach(x=>{const on=x.id===name;x.classList.remove('out');if(on&&!x.classList.contains('on'))x.classList.add('on');if(!on)x.classList.remove('on')});
 if(name==='tabs')renderTabs();if(name==='search')renderSugg();if(name==='set')renderSet();if(name==='setup')renderSetup();shapes()}
function close(){if(!sheet)return;const el=$('#'+sheet);sheet='';$('#q').blur();send({t:'mode',full:false});document.body.classList.remove('full');
 el.classList.remove('on');el.classList.add('out');setTimeout(()=>{if(sheet!==el.id)el.classList.remove('out')},170);shapes()}

// Native glass: report where the .g elements are (layout boxes, ignoring entrance animations),
// plus the bar's box so Rust knows where the bar takes touches.
const lbox=el=>{let x=0,y=0,e=el;while(e){x+=e.offsetLeft;y+=e.offsetTop;e=e.offsetParent}return{x,y,w:el.offsetWidth,h:el.offsetHeight}};
let shSig='',shRaf=0;
function shapes(){if(shRaf)return;shRaf=requestAnimationFrame(()=>{shRaf=0;const b=document.body.classList,r=[],nat=b.contains('native');
 if(!b.contains('flat'))document.querySelectorAll('.g').forEach(el=>{
  if(!el.offsetWidth||!el.getClientRects().length)return;
  const inBar=!!el.closest('#bar'),sh=el.closest('.sheet');
  if((inBar||el.id==='bm')&&b.contains('full'))return;if(sh&&!sh.classList.contains('on'))return;
  const q=lbox(el);r.push({k:el.dataset.k,x:q.x,y:q.y,w:q.w,h:q.h,r:parseFloat(getComputedStyle(el).borderTopLeftRadius)||0,
   from:el.dataset.from||'',btn:nat&&el.dataset.btn||''})});
 // Touch areas for the interface. Native glass buttons take their own touches.
 const box=el=>{const q=lbox(el);return[q.x,q.y,q.w,q.h]},bm=$('#bm'),hasBm=b.contains('hasbm')&&bm.offsetWidth;
 let hot;
 if(nat){hot=[box($('#addr'))];if(hasBm)hot.push(box(bm))}
 else{let hb=lbox($('#bar'));if(hasBm){const q=lbox(bm),x=Math.min(hb.x,q.x),y=Math.min(hb.y,q.y);hb={x,y,w:Math.max(hb.x+hb.w,q.x+q.w)-x,h:Math.max(hb.y+hb.h,q.y+q.h)-y}}hot=[[hb.x,hb.y,hb.w,hb.h]]}
 const msg={t:'shapes',r,hot},sig=JSON.stringify(msg);
 if(sig!==shSig){shSig=sig;send(msg)}})}
addEventListener('resize',shapes);
document.querySelectorAll('[data-close]').forEach(x=>x.onclick=close);

// ----- address / search -----
// The tap on the address bar focuses the search field in the same gesture (iOS only shows the
// keyboard for focus that comes straight from a tap), then the sheet goes full screen.
$('#addr').onclick=e=>{if(e.target.closest('#rl'))return;const q=$('#q');q.value=S.url||'';open('search');q.focus();q.select();renderSugg()};
$('#q').oninput=renderSugg;
$('#q').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go($('#q').value)}};
$('#qx').onclick=close;
function go(q){q=q.trim();if(!q)return;send({t:'go',q});close()}
const looksUrl=q=>/^[a-z][a-z0-9+.-]*:\/\//i.test(q)||(/^[^\s]+\.[a-z]{2,}(\/|$|:)/i.test(q)&&!/\s/.test(q));
function renderSugg(){const q=$('#q').value.trim(),eng=(S.engines.find(e=>e.id===S.engine)||{name:'the web'}).name;let h='';
 if(q){if(looksUrl(q))h+=`<button class="row" data-go="${esc(q)}"><div class="ic">${IC.globe}</div><span><b>${esc(q)}</b><small>Open address</small></span></button>`;
  h+=`<button class="row" data-go="${esc(q)}"><div class="ic">${IC.search}</div><span><b>${esc(q)}</b><small>Search ${esc(eng)}</small></span></button>`}
 const ql=q.toLowerCase(),tabs=S.tabs.filter(t=>t.id!==S.active&&t.url&&(!q||(t.title+' '+t.url).toLowerCase().includes(ql))).slice(0,6);
 if(tabs.length)h+=`<div class="lbl">Switch to tab</div>`+tabs.map(t=>`<button class="row" data-sel="${t.id}"><div class="ic">${t.icon?`<img src="${esc(t.icon)}" onerror="this.replaceWith(document.createRange().createContextualFragment(IC.tab))">`:IC.tab}</div><span><b>${esc(t.title||host(t.url))}</b><small>${esc(host(t.url))}</small></span></button>`).join('');
 $('#sugg').innerHTML=h;
 $('#sugg').querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));
 $('#sugg').querySelectorAll('[data-sel]').forEach(x=>x.onclick=()=>{send({t:'select',id:+x.dataset.sel});close()})}

// ----- tab grid -----
$('#tabsb').onclick=()=>open('tabs');
$('#tdone').onclick=close;
$('#tnew').onclick=()=>{send({t:'new'});const q=$('#q');q.value='';open('search');q.focus()};
// Two taps to close everything (the interface has no system dialogs).
let armed=0;$('#tclear').onclick=()=>{const b=$('#tclear');if(armed){clearTimeout(armed);armed=0;b.textContent='Close all';send({t:'closeAll'});close();return}
 b.textContent='Tap again';armed=setTimeout(()=>{armed=0;b.textContent='Close all'},2500)};
function renderTabs(){$('#tcount').textContent=S.tabs.length===1?'1 tab':S.tabs.length+' tabs';
 $('#grid').innerHTML=S.tabs.map(t=>{const h=host(t.url),name=t.title||h||'New Tab';
  return `<div class="card ${t.id===S.active?'on':''}" data-id="${t.id}" role="button"><div class="hd">${t.icon?`<img src="${esc(t.icon)}" onerror="this.outerHTML='<i></i>'">`:'<i></i>'}<b>${esc(name)}</b></div>
   <div class="bd">${esc((h||'W')[0])}</div><button class="x" data-x="${t.id}" aria-label="Close tab">${IC.x}</button></div>`}).join('');
 $('#grid').querySelectorAll('.card').forEach(c=>c.onclick=e=>{const x=e.target.closest('[data-x]');if(x){send({t:'close',id:+x.dataset.x});return}send({t:'select',id:+c.dataset.id});close()})}

// ----- bar buttons and menu -----
$('#back').onclick=()=>send({t:'back'});
$('#rl').onclick=e=>{e.preventDefault();e.stopPropagation();send({t:S.loading?'stop':'reload'})};
$('#moreb').onclick=()=>open('menu');
$('#menu').addEventListener('click',e=>{if(e.target.id==='menu')close()});
$('#mback').onclick=()=>{send({t:'back'});close()};$('#mfwd').onclick=()=>{send({t:'fwd'});close()};$('#mrl').onclick=()=>{send({t:'reload'});close()};
$('#mnew').onclick=()=>{send({t:'new'});const q=$('#q');q.value='';open('search');q.focus()};
$('#mcopy').onclick=()=>{send({t:'copy'});close()};
$('#mbm').onclick=()=>{send({t:'bookmark'});close()};
function renderBm(){const on=!!(S.set&&S.set.bmbar)&&(S.bookmarks||[]).length>0;document.body.classList.toggle('hasbm',on);
 $('#bm').innerHTML=on?S.bookmarks.map(b=>`<button class="chip" data-url="${esc(b.url)}">${b.icon?`<img src="${esc(b.icon)}" onerror="this.outerHTML='<i></i>'">`:'<i></i>'}<span>${esc(b.title||host(b.url))}</span></button>`).join(''):'';
 $('#bm').querySelectorAll('[data-url]').forEach(x=>x.onclick=()=>send({t:'open',url:x.dataset.url}));
 $('#mbmt').textContent=S.bookmarked?'Remove bookmark':'Add bookmark';$('#mbm').disabled=!(S.url||'').startsWith('http');shapes()}
$('#mdesk').onclick=()=>{send({t:'desktop'});close()};
$('#mblock').onclick=()=>send({t:'set',k:'blocker',v:!S.blocker});
$('#mset').onclick=()=>open('set');$('#setback').onclick=()=>open('menu');
const set=(k,v)=>{S.set[k]=v;applyLook();send({t:'set',k,v})};

// ----- customisation -----
const ACC=['#5e5ce6','#0a84ff','#30b0c7','#34c759','#ff9f0a','#ff375f','#bf5af2','#8e8e93'];
const WALLS=[['','Wisp','radial-gradient(120% 80% at 15% 0%,#3b2a7a,transparent 60%),radial-gradient(100% 70% at 100% 100%,#7a2a4f,transparent 55%),#14121f'],
 ['linear-gradient(160deg,#0f2027,#203a43,#2c5364)','Ocean'],['linear-gradient(160deg,#1a0b2e,#5b2a86,#d4418e)','Dusk'],['linear-gradient(160deg,#0b3d0b,#1e7a3c,#9ad06b)','Forest'],
 ['linear-gradient(160deg,#3a1c71,#d76d77,#ffaf7b)','Sunset'],['#0c0c0f','Black'],['linear-gradient(160deg,#e0eafc,#cfdef3)','Mist'],['linear-gradient(160deg,#ffecd2,#fcb69f)','Peach'],['linear-gradient(160deg,#fdfbfb,#e6e9ee)','Paper']];
const FONTS=[['system','System','Apple’s SF Pro','-apple-system,system-ui'],['rounded','Rounded','Soft and friendly','ui-rounded,-apple-system'],['serif','Serif','Classic, like New York','ui-serif,Georgia,serif'],['mono','Mono','Monospaced','ui-monospace,Menlo,monospace']];
const lum=h=>{const n=parseInt(h.slice(1),16),f=c=>{c/=255;return c<=.03928?c/12.92:((c+.055)/1.055)**2.4};return .2126*f(n>>16&255)+.7152*f(n>>8&255)+.0722*f(n&255)};
function applyLook(){shapes();const c=S.set||{},b=document.body.classList;b.toggle('native',!!S.native&&c.glass!==false);b.toggle('flat',c.glass===false);b.toggle('top',c.bar==='top');
 ['rounded','serif','mono'].forEach(f=>b.toggle('f-'+f,c.font===f));const r=document.documentElement.style;
 if(c.accent){r.setProperty('--accent',c.accent);r.setProperty('--accent-fg',lum(c.accent)>.45?'#111':'#fff')}}
const segOf=(k,opts)=>`<div class="seg">${opts.map(([v,n])=>`<button data-k="${k}" data-v="${v}" class="${String(S.set[k])===String(v)?'on':''}">${n}</button>`).join('')}</div>`;
const swOf=(k,t,sub)=>`<button class="row" data-tog="${k}"><span><b>${t}</b>${sub?`<small>${sub}</small>`:''}</span><div class="sw ${S.set[k]?'on':''}"><i></i></div></button>`;
const accOf=()=>`<div class="sws">${ACC.map(a=>`<button data-k="accent" data-v="${a}" style="background:${a}" class="${S.set.accent===a?'on':''}" aria-label="Accent ${a}"></button>`).join('')}</div>`;
const phone=(top,cls)=>`<div class="ph ${cls||''}"><i class="pg" style="top:${top?28:8}px;bottom:${top?8:28}px"></i><i style="${top?'top:8px':'bottom:8px'}"></i></div>`;
const layOpts=()=>`<div class="opts">${[['bottom','Bottom bar','Easy to reach with one hand'],['top','Top bar','Classic, like a desktop browser']].map(([v,n,d])=>
 `<button class="opt ${S.set.bar===v?'on':''}" data-k="bar" data-v="${v}">${phone(v==='top')}<b>${n}</b><small>${d}</small></button>`).join('')}</div>`;
const glassOpts=()=>`<div class="opts">${[[true,'Glass','Frosted, see-through bars','glassy'],[false,'Flat','Solid and simple','flatty']].map(([v,n,d,c])=>
 `<button class="opt ${S.set.glass===v?'on':''}" data-k="glass" data-v="${v}">${phone(S.set.bar==='top',c)}<b>${n}</b><small>${d}</small></button>`).join('')}</div>`;
const fontOpts=()=>`<div class="opts">${FONTS.map(([v,n,d,f])=>`<button class="opt ${S.set.font===v?'on':''}" data-k="font" data-v="${v}"><div class="aa" style="font-family:${f}"><span>Aa</span><em>The quick brown fox</em></div><b>${n}</b><small>${d}</small></button>`).join('')}</div>`;
const themeSeg=()=>segOf('theme',[['system','Automatic'],['light','Light'],['dark','Dark']]);
function wire(root){
 root.querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>{let v=x.dataset.v;if(v==='true'||v==='false')v=v==='true';set(x.dataset.k,v);rerender()});
 root.querySelectorAll('[data-tog]').forEach(x=>x.onclick=()=>{const k=x.dataset.tog;set(k,!S.set[k]);rerender()});
 root.querySelectorAll('[data-eng]').forEach(x=>x.onclick=()=>{send({t:'set',k:'engine',v:x.dataset.eng})});
 root.querySelectorAll('[data-unbm]').forEach(x=>x.onclick=()=>send({t:'unbookmark',url:x.dataset.unbm}))}
function rerender(){if(sheet==='set')renderSet();if(sheet==='setup')renderSetup()}
function renderSet(){const b=$('#setbody'),y=b.scrollTop;
 b.innerHTML=`<div class="lbl">Theme</div>${themeSeg()}
  <div class="lbl">Layout</div>${layOpts()}
  <div class="lbl">Style</div>${glassOpts()}
  <div class="lbl">Font</div>${fontOpts()}
  <div class="lbl">Accent colour</div>${accOf()}
  <div class="lbl">New Tab</div><div class="walls">${WALLS.map(([v,n,pv])=>`<button data-k="wall" data-v="${v}" style="background:${pv||v}" class="${(S.set.wall||'')===v?'on':''}"><span>${n}</span></button>`).join('')}</div>
  <div class="list">${swOf('clock','Show clock')}${swOf('dial','Show shortcuts')}</div>
  <div class="lbl">Bookmarks</div><div class="list">${swOf('bmbar','Show bookmarks bar','Your bookmarks, one tap away next to the address bar.')}
   ${(S.bookmarks||[]).map(b=>`<div class="row"><div class="ic">${b.icon?`<img src="${esc(b.icon)}" onerror="this.remove()">`:''}</div><span><b>${esc(b.title||host(b.url))}</b><small>${esc(host(b.url))}</small></span><button class="ib" data-unbm="${esc(b.url)}" aria-label="Remove bookmark" style="width:36px;height:36px">${IC.x}</button></div>`).join('')||'<div class="row"><span><small>Add one from the menu: ⋯ → Add bookmark.</small></span></div>'}</div>
  <div class="lbl">Search engine</div><div class="list">${S.engines.map(e=>`<button class="row ${e.id===S.engine?'on':''}" data-eng="${e.id}"><span><b>${esc(e.name)}</b></span><span class="chk">${IC.check}</span></button>`).join('')}</div>
  <div class="lbl">Privacy</div><div class="list">${swOf('blocker','Block ads & trackers','Blocks common ad and tracking networks on every site.')}</div>
  <div class="list" style="margin-top:18px"><button class="row" id="resetup"><span><b>Show the welcome setup again</b></span></button></div>
  <div class="about">Wisp ${esc(S.version)} · pages use WebKit, the engine built into iOS</div>`;
 b.scrollTop=y;wire(b);$('#resetup').onclick=()=>{su=0;open('setup')}}

// ----- first-run setup -----
let su=0,suShown=-1,suAuto=false;
const STEPS=[
 ()=>`<div class="logo">W</div><h1>Welcome to Wisp</h1><p class="sub">A light, private browser. Let’s pick how it looks; you can change any of this later in Settings.</p><div class="lbl">Theme</div>${themeSeg()}`,
 ()=>`<h1>Choose a layout</h1><p class="sub">Same features either way, just where the bar sits.</p>${layOpts()}`,
 ()=>`<h1>Glass or flat</h1><p class="sub">Frosted, see-through bars, or solid ones.</p>${glassOpts()}`,
 ()=>`<h1>Make it yours</h1><p class="sub">Pick a font and an accent colour.</p>${fontOpts()}<div class="lbl">Accent colour</div>${accOf()}`];
function renderSetup(){const b=$('#subody'),y=b.scrollTop,anim=suShown!==su;suShown=su;
 b.innerHTML=`<div class="${anim?'step':''}">${STEPS[su]()}</div>`;if(!anim)b.scrollTop=y;wire(b);
 $('#sudots').innerHTML=STEPS.map((_,i)=>`<i class="${i===su?'on':''}"></i>`).join('');
 $('#suback').style.visibility=su?'visible':'hidden';$('#sunext').textContent=su<STEPS.length-1?'Continue':'Start browsing'}
$('#sunext').onclick=()=>{if(su<STEPS.length-1){su++;renderSetup()}else{set('setup_done',true);close()}};
$('#suback').onclick=()=>{if(su){su--;renderSetup()}};
send({t:'ready'});
// Safe areas can arrive after the first layout; measure the glass again once things settle.
addEventListener('load',()=>{shapes();setTimeout(shapes,300)});
</script></body></html>
