<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
/* Wisp for iOS interface. Sits on a system blur (UIVisualEffectView), so backgrounds here are
   transparent or lightly tinted. Two sizes: the bottom bar, and full screen for search, the tab
   grid and the menu. */
:root{--accent:#5e5ce6;--fg:#f2f2f7;--fg2:rgba(242,242,247,.68);--fg3:rgba(242,242,247,.45);--line:rgba(255,255,255,.1);
 --fill:rgba(255,255,255,.1);--fill2:rgba(255,255,255,.16);--card:rgba(40,40,52,.72);--tint:rgba(10,10,16,.35);
 --ease:cubic-bezier(.16,.84,.44,1);color-scheme:dark}
@media (prefers-color-scheme:light){:root{--fg:#111118;--fg2:rgba(17,17,24,.66);--fg3:rgba(17,17,24,.45);--line:rgba(0,0,0,.09);
 --fill:rgba(0,0,0,.06);--fill2:rgba(0,0,0,.1);--card:rgba(255,255,255,.8);--tint:rgba(240,240,246,.3);color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:transparent;color:var(--fg);font:15px/1.3 -apple-system,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
@media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important;transition-duration:1ms!important}}

/* ---------- bottom bar ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;height:calc(54px + env(safe-area-inset-bottom));padding:0 calc(8px + env(safe-area-inset-right)) env(safe-area-inset-bottom) calc(8px + env(safe-area-inset-left));
 display:flex;align-items:center;gap:4px;border-top:.5px solid var(--line)}
#prog{position:absolute;left:0;top:-1px;height:2px;width:100%;background:var(--accent);transform-origin:left;transform:scaleX(0);opacity:0;transition:transform .4s var(--ease),opacity .25s}
body.loading #prog{opacity:1;transform:scaleX(.85);transition:transform 6s cubic-bezier(.1,.6,.2,1),opacity .15s}
body.done #prog{opacity:0;transform:scaleX(1);transition:transform .2s var(--ease),opacity .3s .15s}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:22px;flex:none;color:var(--fg)}
.ib:active{background:var(--fill)}.ib:disabled{color:var(--fg3)}
#addr{flex:1;min-width:0;height:40px;border-radius:20px;background:var(--fill);display:flex;align-items:center;gap:6px;padding:0 14px;position:relative}
#addr .lock{width:13px;height:13px;stroke-width:2.2;color:var(--fg2);flex:none}
#url{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;color:var(--fg);font:inherit;font-size:15px;text-align:center;padding:0;-webkit-user-select:text;user-select:text;text-overflow:ellipsis}
#url::placeholder{color:var(--fg2)}
#rl{width:30px;height:30px;margin-right:-8px}
#count{width:24px;height:24px;border:1.8px solid currentColor;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700}

/* ---------- full-screen sheets ---------- */
.sheet{position:fixed;inset:0;display:none;background:var(--tint);flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
body.full #bar{display:none}
body.s-search #search,body.s-tabs #tabs,body.s-menu #menu,body.s-set #set{display:flex;animation:in .18s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px}
.top h2{flex:1;margin:0;font-size:17px;font-weight:600;text-align:center}
.txt{color:var(--accent);font-weight:600;font-size:16px;padding:8px 4px;min-width:64px}
.txt.l{text-align:left}.txt.r{text-align:right}

/* search */
#sbox{flex:1;height:42px;border-radius:21px;background:var(--fill);display:flex;align-items:center;gap:8px;padding:0 14px}
#sbox svg{width:17px;height:17px;color:var(--fg2)}
#q{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--fg);font:inherit;font-size:16px;-webkit-user-select:text;user-select:text}
#sugg{flex:1;overflow-y:auto;padding:4px 10px 20px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:14px;text-align:left}
.row:active{background:var(--fill)}
.row .ic{width:30px;height:30px;border-radius:9px;background:var(--fill);display:grid;place-items:center;flex:none;overflow:hidden}
.row .ic svg{width:17px;height:17px}.row .ic img{width:18px;height:18px}
.row b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;color:var(--fg2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row span{min-width:0;flex:1}
.lbl{color:var(--fg2);font-size:13px;font-weight:600;padding:16px 12px 6px}

/* tab grid */
#grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:6px 16px 20px;align-content:start}
.card{position:relative;height:190px;border-radius:18px;background:var(--card);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;text-align:left;transition:transform .15s var(--ease)}
.card:active{transform:scale(.97)}
.card.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.card .hd{display:flex;align-items:center;gap:7px;padding:10px 36px 8px 10px;font-size:13px;font-weight:600}
.card .hd img,.card .hd i{width:16px;height:16px;border-radius:4px;flex:none;background:var(--fill)}
.card .hd b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .bd{flex:1;margin:0 8px 8px;border-radius:12px;background:var(--fill);display:grid;place-items:center;color:var(--fg3);font-size:34px;font-weight:700;text-transform:uppercase}
.card .x{position:absolute;right:6px;top:5px;width:28px;height:28px;border-radius:14px;display:grid;place-items:center;color:var(--fg2)}
.card .x svg{width:15px;height:15px;stroke-width:2.2}
.foot{display:flex;align-items:center;justify-content:space-between;padding:8px 16px calc(10px + env(safe-area-inset-bottom));border-top:.5px solid var(--line)}
.plus{width:48px;height:48px;border-radius:24px;background:var(--accent);color:#fff;display:grid;place-items:center}

/* menu and settings */
.list{margin:6px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.list .row{border-radius:0;padding:13px 14px}.list .row+.row{border-top:.5px solid var(--line)}
.grow{flex:1}
.mbot{margin-top:auto;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.navrow{display:flex;gap:10px;margin:6px 14px}
.navrow button{flex:1;height:58px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--fg2)}
.navrow button svg{color:var(--fg)}.navrow button:disabled{opacity:.4}
.sw{margin-left:auto;width:50px;height:30px;border-radius:15px;background:var(--fill2);position:relative;flex:none;transition:background .2s}
.sw i{position:absolute;left:2px;top:2px;width:26px;height:26px;border-radius:13px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s var(--ease)}
.sw.on{background:#34c759}.sw.on i{transform:translateX(20px)}
.chk{margin-left:auto;color:var(--accent);opacity:0}.on .chk{opacity:1}
.about{color:var(--fg2);font-size:13px;text-align:center;padding:16px}
</style></head><body>

<div id="bar">
 <div id="prog"></div>
 <button class="ib" id="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
 <label id="addr"><svg class="lock" viewBox="0 0 24 24" id="lock"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
  <input id="url" type="text" readonly placeholder="Search or enter address" aria-label="Address">
  <button class="ib" id="rl" aria-label="Reload"><svg viewBox="0 0 24 24" style="width:17px;height:17px"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button></label>
 <button class="ib" id="tabsb" aria-label="Tabs"><span id="count">1</span></button>
 <button class="ib" id="moreb" aria-label="Menu"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/></svg></button>
</div>

<div class="sheet" id="search">
 <div class="top"><div id="sbox"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
  <input id="q" type="search" enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Search or enter address"></div>
  <button class="txt r" id="qx">Cancel</button></div>
 <div id="sugg"></div>
</div>

<div class="sheet" id="tabs">
 <div class="top"><button class="txt l" id="tclear">Close all</button><h2 id="tcount">Tabs</h2><button class="txt r" id="tdone">Done</button></div>
 <div id="grid"></div>
 <div class="foot"><span style="width:64px"></span><button class="plus" id="tnew" aria-label="New tab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><span style="width:64px"></span></div>
</div>

<div class="sheet" id="menu">
 <div class="top"><span style="width:64px"></span><h2>Wisp</h2><button class="txt r" data-close>Done</button></div>
 <div class="mbot">
  <div class="navrow">
   <button id="mback"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Back</button>
   <button id="mfwd"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>Forward</button>
   <button id="mrl"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>Reload</button>
  </div>
  <div class="list">
   <button class="row" id="mnew"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div><span><b>New tab</b></span></button>
   <button class="row" id="mcopy"><div class="ic"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></div><span><b>Copy link</b></span></button>
   <button class="row" id="mdesk"><div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></div><span><b id="mdeskt">Request desktop site</b></span></button>
   <button class="row" id="mblock"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg></div><span><b>Block ads & trackers</b></span><div class="sw" id="blocksw"><i></i></div></button>
   <button class="row" id="mset"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></div><span><b>Settings</b></span></button>
  </div>
 </div>
</div>

<div class="sheet" id="set">
 <div class="top"><button class="txt l" id="setback">Back</button><h2>Settings</h2><span style="width:64px"></span></div>
 <div style="overflow-y:auto;flex:1;padding-bottom:20px">
  <div class="lbl">Search engine</div><div class="list" id="engines"></div>
  <div class="lbl">Privacy</div>
  <div class="list"><button class="row" id="sblock"><span><b>Block ads & trackers</b><small>Blocks common ad and tracking networks on every site.</small></span><div class="sw" id="blocksw2"><i></i></div></button></div>
  <div class="about" id="about"></div>
 </div>
</div>

<script>
const $=s=>document.querySelector(s),send=m=>{try{webkit.messageHandlers.wisp.postMessage(JSON.stringify(m))}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}};
const IC={x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>',
 globe:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',tab:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/></svg>',
 check:'<svg viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M5 12l5 5 9-10"/></svg>'};
let S={tabs:[],active:0,url:'',title:'',engines:[],engine:'ddg',blocker:true},sheet='',wasLoading=false;

// ----- state from Wisp -----
window.wisp={state(s){S=s;render()}};
function render(){
 const b=document.body.classList,u=S.url||'';
 $('#url').value=u?host(u)||u:'';$('#lock').style.display=u.startsWith('https:')?'':'none';
 $('#count').textContent=S.tabs.length>99?':)':S.tabs.length;$('#back').disabled=!S.back;
 $('#rl').innerHTML=S.loading?'<svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M6 6l12 12M18 6L6 18"/></svg>':'<svg viewBox="0 0 24 24" style="width:17px;height:17px"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>';
 $('#rl').style.display=u?'':'none';
 if(S.loading&&!wasLoading){b.remove('done');b.add('loading')}
 if(!S.loading&&wasLoading){b.remove('loading');b.add('done')}
 wasLoading=S.loading;
 $('#mback').disabled=!S.back;$('#mfwd').disabled=!S.fwd;
 $('#mdeskt').textContent=S.desktop?'Request mobile site':'Request desktop site';
 ['#blocksw','#blocksw2'].forEach(x=>$(x).classList.toggle('on',!!S.blocker));
 $('#engines').innerHTML=S.engines.map(e=>`<button class="row ${e.id===S.engine?'on':''}" data-eng="${e.id}"><span><b>${esc(e.name)}</b></span><span class="chk">${IC.check}</span></button>`).join('');
 $('#about').textContent='Wisp '+S.version+' · pages use WebKit, the engine built into iOS';
 if(sheet==='tabs')renderTabs();if(sheet==='search')renderSugg();
}

// ----- sheets (full screen) -----
function open(name){sheet=name;const b=document.body.classList;b.add('full');['search','tabs','menu','set'].forEach(n=>b.toggle('s-'+n,n===name));send({t:'mode',full:true});
 if(name==='tabs')renderTabs();if(name==='search')renderSugg()}
function close(){sheet='';const b=document.body.classList;b.remove('full','s-search','s-tabs','s-menu','s-set');$('#q').blur();send({t:'mode',full:false})}
document.querySelectorAll('[data-close]').forEach(x=>x.onclick=close);

// ----- address / search -----
// The tap on the address bar focuses the search field in the same gesture (iOS only shows the
// keyboard for focus that comes straight from a tap), then the sheet goes full screen.
$('#addr').onclick=e=>{if(e.target.closest('#rl'))return;const q=$('#q');q.value=S.url||'';open('search');q.focus();q.select();renderSugg()};
$('#q').oninput=renderSugg;
$('#q').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go($('#q').value)}};
$('#qx').onclick=close;
function go(q){q=q.trim();if(!q)return;send({t:'go',q});close()}
const looksUrl=q=>/^[a-z][a-z0-9+.-]*:\/\//i.test(q)||(/^[^\s]+\.[a-z]{2,}(\/|$|:)/i.test(q)&&!/\s/.test(q));
function renderSugg(){const q=$('#q').value.trim(),eng=(S.engines.find(e=>e.id===S.engine)||{name:'the web'}).name;let h='';
 if(q){if(looksUrl(q))h+=`<button class="row" data-go="${esc(q)}"><div class="ic">${IC.globe}</div><span><b>${esc(q)}</b><small>Open address</small></span></button>`;
  h+=`<button class="row" data-go="${esc(q)}"><div class="ic">${IC.search}</div><span><b>${esc(q)}</b><small>Search ${esc(eng)}</small></span></button>`}
 const ql=q.toLowerCase(),tabs=S.tabs.filter(t=>t.id!==S.active&&t.url&&(!q||(t.title+' '+t.url).toLowerCase().includes(ql))).slice(0,6);
 if(tabs.length)h+=`<div class="lbl">Switch to tab</div>`+tabs.map(t=>`<button class="row" data-sel="${t.id}"><div class="ic">${t.icon?`<img src="${esc(t.icon)}" onerror="this.replaceWith(document.createRange().createContextualFragment(IC.tab))">`:IC.tab}</div><span><b>${esc(t.title||host(t.url))}</b><small>${esc(host(t.url))}</small></span></button>`).join('');
 $('#sugg').innerHTML=h;
 $('#sugg').querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));
 $('#sugg').querySelectorAll('[data-sel]').forEach(x=>x.onclick=()=>{send({t:'select',id:+x.dataset.sel});close()})}

// ----- tab grid -----
$('#tabsb').onclick=()=>open('tabs');
$('#tdone').onclick=close;
$('#tnew').onclick=()=>{send({t:'new'});const q=$('#q');q.value='';open('search');q.focus()};
// Two taps to close everything (the interface has no system dialogs).
let armed=0;$('#tclear').onclick=()=>{const b=$('#tclear');if(armed){clearTimeout(armed);armed=0;b.textContent='Close all';send({t:'closeAll'});close();return}
 b.textContent='Tap again';armed=setTimeout(()=>{armed=0;b.textContent='Close all'},2500)};
function renderTabs(){$('#tcount').textContent=S.tabs.length===1?'1 tab':S.tabs.length+' tabs';
 $('#grid').innerHTML=S.tabs.map(t=>{const h=host(t.url),name=t.title||h||'New Tab';
  return `<div class="card ${t.id===S.active?'on':''}" data-id="${t.id}" role="button"><div class="hd">${t.icon?`<img src="${esc(t.icon)}" onerror="this.outerHTML='<i></i>'">`:'<i></i>'}<b>${esc(name)}</b></div>
   <div class="bd">${esc((h||'W')[0])}</div><button class="x" data-x="${t.id}" aria-label="Close tab">${IC.x}</button></div>`}).join('');
 $('#grid').querySelectorAll('.card').forEach(c=>c.onclick=e=>{const x=e.target.closest('[data-x]');if(x){send({t:'close',id:+x.dataset.x});return}send({t:'select',id:+c.dataset.id});close()})}

// ----- bar buttons and menu -----
$('#back').onclick=()=>send({t:'back'});
$('#rl').onclick=e=>{e.preventDefault();e.stopPropagation();send({t:S.loading?'stop':'reload'})};
$('#moreb').onclick=()=>open('menu');
$('#mback').onclick=()=>{send({t:'back'});close()};$('#mfwd').onclick=()=>{send({t:'fwd'});close()};$('#mrl').onclick=()=>{send({t:'reload'});close()};
$('#mnew').onclick=()=>{send({t:'new'});const q=$('#q');q.value='';open('search');q.focus()};
$('#mcopy').onclick=()=>{send({t:'copy'});close()};
$('#mdesk').onclick=()=>{send({t:'desktop'});close()};
$('#mblock').onclick=$('#sblock').onclick=()=>send({t:'set',k:'blocker',v:!S.blocker});
$('#mset').onclick=()=>open('set');$('#setback').onclick=()=>open('menu');
$('#engines').onclick=e=>{const r=e.target.closest('[data-eng]');if(r)send({t:'set',k:'engine',v:r.dataset.eng})};
send({t:'ready'});
</script></body></html>
