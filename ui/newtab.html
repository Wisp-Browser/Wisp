<style>

select,.in{height:34px;border-radius:10px;border:1px solid var(--line-2);background:var(--raised);padding:0 11px;outline:0;color:var(--fg)}
.in{width:100%}.in::placeholder{color:var(--fg3)}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{height:28px;padding:0 6px 0 11px;border-radius:var(--pill);border:1px solid var(--line-2);background:var(--raised);font-size:12px;display:flex;align-items:center;gap:6px}
.chip:hover{background:var(--raised-2)}.chip .i{width:12px;height:12px;color:var(--fg2)}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sw i{width:26px;height:26px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);transition:transform var(--dur) var(--ease)}.sw i:hover{transform:scale(1.1)}.sw i.on{border-color:var(--fg)}
.wrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}.wrow span{font-size:13.5px;line-height:1.35}
.seg.sm{flex:none}.seg.full button{flex:1}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:10px}.addrow{display:flex;gap:8px;align-items:center}.addrow .in{flex:1;min-width:0}
.hint{color:var(--fg2);font-size:12px;display:block;margin-top:4px;line-height:1.4}
</style></head><body class="glass">

 ['Dusk','linear-gradient(160deg,#171742,#0c0c20 55%,#1d1140)',0],['Nebula','radial-gradient(700px 500px at 75% 15%,#5a4bb899,transparent 70%),radial-gradient(700px 500px at 10% 95%,#ff6b5e44,transparent 70%),linear-gradient(160deg,#171742,#0c0c20 55%,#1d1140)',0],

// ---- animated dots (shared logic with the new tab page) ----
function makeFx(canvas){const cx=canvas.getContext('2d');let P=[],raf=0,last=0,mode='none',speed=1,w=0,h=0,shoot=null,nextShoot=3e3,gap=40,hold=0;
 const R=Math.random;
 function init(){w=canvas.width=innerWidth;h=canvas.height=innerHeight;const n=mode==='particles'?70:110;P=[];
  for(let i=0;i<n;i++){const z=R();P.push({x:R()*w,y:R()*h,z,r:.5+z*1.7,a:R()*6.28,tw:.6+R()*1.6,d:R()*6.28})}}
 function loop(t){raf=requestAnimationFrame(loop);if(t-last<gap||t<hold)return;const dt=Math.min((t-last)/1000,.1);last=t;cx.clearRect(0,0,w,h);cx.fillStyle='#fff';

  }else{

   cx.lineWidth=1;for(let i=0;i<P.length;i++){const a=P[i];for(let j=i+1;j<P.length;j++){const b=P[j],dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy;

function pane(){
 if(dtab==='wall')return `
  <h5>Dark</h5><div class="gal">${GALLERY.map((g,i)=>g[2]?'':tile(g,i)).join('')}</div>
  <h5>Light</h5><div class="gal">${GALLERY.map((g,i)=>g[2]?tile(g,i):'').join('')}</div>
  <h5>Your own</h5>
  <button class="btn wide" id="up">${ico('upload')}Upload image, video or GIF</button>
  <div class="row"><label>Solid colour</label><input type="color" id="solid" value="#14142c"></div>
  <div class="row"><label>Gradient</label><input type="color" id="g1" value="${grad.a}"><input type="color" id="g2" value="${grad.b}"><button class="btn sm" id="gapply">Apply</button></div>
  ${rng('Angle',grad.deg,0,360,1,v=>v+'°','deg')}
  <h5>Look</h5>${rng('Blur',cfg.blur||0,0,40,1,v=>v+'px','blur')}${rng('Dim',cfg.dim||0,0,80,1,v=>v+'%','dim')}
  <h5>Animated background</h5>
  <div class="seg">${[['none','Off'],['stars','Stars'],['particles','Particles']].map(o=>`<button data-fx="${o[0]}" class="${(cfg.effect||'stars')===o[0]?'on':''}">${o[1]}</button>`).join('')}</div>
  ${(cfg.effect||'stars')!=='none'?rng('Speed',cfg.speed||1,0.2,3,0.1,v=>(+v).toFixed(1)+'×','speed'):''}`;
 if(dtab==='wid')return `
  <h5>Show on this page</h5>
  ${WIDS.map(w=>`<div class="wrow"><span>${w[1]}</span>${tog(cfg.widgets[w[0]].on,'w:'+w[0])}</div>`).join('')}
  <div class="row" style="margin-top:12px"><button class="btn ${edit?'on':''}" id="edit">${edit?ico('check')+'Done moving':ico('move')+'Move widgets'}</button><button class="btn" id="reset">Reset positions</button></div>
  ${edit?'<small class="hint">Drag any widget on the page, then press Done.</small>':''}
  ${cfg.widgets.dial.on?`<h5>Speed dial shortcuts</h5><div class="chips">${cfg.dial.map((s,i)=>`<div class="chip" data-x="${i}" title="Remove">${esc(s.n)} ${ico('x')}</div>`).join('')||'<small class="hint">No shortcuts yet.</small>'}</div>
   <div class="stack"><input class="in" id="dn" placeholder="Name (optional)"><div class="addrow"><input class="in" id="du" placeholder="Website, e.g. github.com"><button class="btn sm" id="dadd">Add</button></div></div>`:''}
  ${cfg.widgets.weather.on?`<h5>Weather</h5><div class="addrow"><input class="in" id="city" placeholder="City or ZIP" value="${esc(cfg.weather.city)}"><div class="seg sm">${['F','C'].map(u=>`<button data-u="${u}" class="${cfg.weather.unit===u?'on':''}">°${u}</button>`).join('')}</div></div>`:''}`;
 return `
  <h5>Mode</h5><div class="seg full">${[[0,'Dark'],[1,'Light']].map(o=>`<button data-m="${o[0]}" class="${(!!theme.light)===!!o[0]?'on':''}">${o[1]}</button>`).join('')}</div>
  <h5>Accent colour</h5><div class="sw">${ACC.map(a=>`<i data-a="${a}" style="background:${a};color:${a}" class="${theme.accent===a?'on':''}"></i>`).join('')}<input type="color" id="acc" value="${theme.accent}"></div>
  <h5>Glass</h5>${rng('Intensity',theme.glass,0,1,0.01,v=>Math.round(v*100)+'%','glass')}<small class="hint">Layout and the Glass / Flat style are in Settings → Appearance.</small>
  <h5>Performance</h5><div class="wrow"><span>Reduce effects<br><small class="hint">Turns off animation and heavy blur. Try this on older GPUs.</small></span>${tog(theme.perf,'perf')}</div>`}
function drawer(){const d=$('#drawer'),open=d.classList.contains('open'),sc=d.querySelector('.dbody');const top=sc?sc.scrollTop:0;
 d.innerHTML=`<div class="dh"><h3>Customize</h3><small>${esc(space.name||'This space')} · wallpaper and widgets are saved per space</small>
  <div class="dtabs"><div class="seg">${[['wall','Wallpaper'],['wid','Widgets'],['app','Appearance']].map(t=>`<button class="${dtab===t[0]?'on':''}" data-d="${t[0]}">${t[1]}</button>`).join('')}</div></div></div><div class="dbody">${pane()}</div>`;
 d.querySelector('.dbody').scrollTop=top;
 if(open)d.classList.add('open')}
const drawerEl=$('#drawer'),setWall=(w)=>{cfg.wall=w;applyTheme();applyWall();save(true)};
drawerEl.addEventListener('click',e=>{const t=e.target.closest('button,i,.chip');if(!t)return;
 if(t.dataset.d){dtab=t.dataset.d;edit=false;document.body.classList.remove('edit');drawer();return}
 if(t.dataset.g!==undefined){const g=GALLERY[+t.dataset.g];setWall({kind:'gradient',css:g[1],light:!!g[2]});drawer();return}
 if(t.id==='up'){send({t:'pick_wallpaper'});return}
 if(t.id==='gapply'){setWall({kind:'gradient',css:`linear-gradient(${grad.deg}deg,${grad.a},${grad.b})`,light:(lum(grad.a)+lum(grad.b))/2>.6});drawer();return}
 if(t.dataset.fx){cfg.effect=t.dataset.fx;applyFx();save();drawer();return}
 if(t.dataset.tg){const k=t.dataset.tg;if(k==='perf'){theme.perf=!theme.perf;applyTheme();applyFx();send({t:'theme_set',accent:theme.accent,glass:theme.glass,perf:theme.perf})}
   else{const id=k.slice(2);cfg.widgets[id].on=!cfg.widgets[id].on;renderWidgets();save()}drawer();return}
 if(t.id==='edit'){edit=!edit;document.body.classList.toggle('edit',edit);drawer();return}
 if(t.id==='reset'){cfg.widgets=Object.assign(cfg.widgets,Object.fromEntries(Object.entries(DEF().widgets).map(([k,v])=>[k,{...cfg.widgets[k],x:v.x,y:v.y}])));renderWidgets();save();return}
 if(t.dataset.x!==undefined||t.closest('[data-x]')){const i=+(t.dataset.x??t.closest('[data-x]').dataset.x);cfg.dial.splice(i,1);renderWidgets();save();drawer();return}
 if(t.id==='dadd'){let u=$('#du').value.trim(),n=$('#dn').value.trim();if(!u)return;if(!/^https?:\/\//.test(u))u='https://'+u;cfg.dial.push({n:n||u.replace(/^https?:\/\/(www\.)?/,'').split('/')[0],u});renderWidgets();save();drawer();return}
 if(t.dataset.u){cfg.weather.unit=t.dataset.u;renderWidgets();save();drawer();return}
 if(t.dataset.m!==undefined){const want=!!+t.dataset.m;if(want!==!!theme.light)send({t:'theme'});return}
 if(t.dataset.a){theme.accent=t.dataset.a;applyTheme();send({t:'theme_set',accent:theme.accent,glass:theme.glass,perf:!!theme.perf});drawer();return}});
drawerEl.addEventListener('input',e=>{const r=e.target;
 if(r.dataset.r){const v=+r.value,k=r.dataset.r;r.nextElementSibling.textContent=k==='blur'?v+'px':k==='dim'?v+'%':k==='deg'?v+'°':k==='speed'?v.toFixed(1)+'×':Math.round(v*100)+'%';
  if(k==='blur'||k==='dim'){cfg[k]=v;if(!rafW)rafW=requestAnimationFrame(()=>{rafW=0;applyWall()});save()}
  else if(k==='speed'){cfg.speed=v;applyFx();save()}else if(k==='deg')grad.deg=v;
  else if(k==='glass'){theme.glass=v;applyTheme();send({t:'theme_set',accent:theme.accent,glass:v,perf:!!theme.perf})}return}
 if(r.id==='solid'){setWall({kind:'solid',css:r.value,light:lum(r.value)>.6})}
 else if(r.id==='g1')grad.a=r.value;else if(r.id==='g2')grad.b=r.value;
 else if(r.id==='acc'){theme.accent=r.value;applyTheme();send({t:'theme_set',accent:theme.accent,glass:theme.glass,perf:!!theme.perf})}});
drawerEl.addEventListener('change',e=>{if(e.target.id==='city'){cfg.weather.city=e.target.value;renderWidgets();save()}});
$('#gear').innerHTML=ico('settings')+'Customize';
$('#gear').onclick=()=>{drawer();$('#drawer').classList.toggle('open')};$('#gear').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#gear').click()}};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#drawer').classList.remove('open')});
// host callbacks
window.wispUpdate=p=>{const old=cfg,nc=merge(DEF(),p.cfg||{});
 const themeChanged=canon(theme)!==canon(p.theme),recentChanged=canon(recent)!==canon(p.recent||[]);
 if(canon(nc)===sent&&!themeChanged&&!recentChanged)return; // echo of our own save: nothing to redo
 cfg=nc;theme=p.theme;recent=p.recent||[];space=p.space||space;
 if(themeChanged)applyTheme();
 if(canon(old.wall)!==canon(nc.wall)||old.blur!==nc.blur||old.dim!==nc.dim)applyWall();
 if(old.effect!==nc.effect||old.speed!==nc.speed)applyFx();
 const ae=document.activeElement;if(!(ae&&(ae.tagName==='TEXTAREA'||ae.tagName==='INPUT'))&&(canon(old.widgets)!==canon(nc.widgets)||canon(old.dial)!==canon(nc.dial)||(recentChanged&&nc.widgets.recent.on)||canon(old.weather)!==canon(nc.weather)))renderWidgets();
 if(!$('#drawer').contains(ae))drawer()};
window.wispWallpaper=(url,kind)=>{setWall({kind,url});drawer()};
renderWidgets();applyWall();applyFx();applyTheme();send({t:'nt_ready'});
</script></body></html>
