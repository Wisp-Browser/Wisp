<!doctype html><html><head><meta charset="utf-8"><title>Wisp</title><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/ai.css"><link rel="stylesheet" href="/m5.css">
<style>
/* Layout geometry (logical px) — mirrored in src/main.rs (App::content). */
body{--h1:40px;--h2:44px;--ct:86px;--cl:8px;--rt:8px;--sw:232px}
body.lay-compact,body.lay-vertical{--h1:46px;--h2:0px;--ct:48px}
body.lay-vertical{--cl:calc(var(--sw) + 16px)}
body.lay-vertical.collapsed{--sw:52px}
html{background:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font:13px/1.35 var(--font);color:var(--fg);background:transparent;-webkit-font-smoothing:antialiased}
/* Background layers. The chrome window sits above the page views, so these are masked out of the page
   areas (with smooth rounded corners) and the pages show through. */
#bg{position:fixed;inset:0;pointer-events:none}
#base{position:absolute;inset:0;background:var(--bg)}
body.osfx #base{display:none}
/* Over the window's Mica backdrop the page corners are covered by small wedges in Mica's colour. */
body{--mica:#202020}body.light{--mica:#f3f3f3}
#wedges i{position:fixed;display:block}
body:not(.osfx) #wedges,#wall:not(.def)~#wedges{display:none}
*{user-select:none}
#wall,#wallv,#dim,#tint{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#wall{background-size:cover;background-position:center}
#wall.def{background:none}
body:not(.osfx) #wall.def{background:var(--bg)}
#wallv{object-fit:cover;display:none}
#tint{background:var(--frame)}
body.flat #wall,body.flat #wallv,body.flat #dim{display:none!important}
.rz{position:fixed;z-index:20}
#parts{display:none}

/* rows */
.row{position:fixed;left:0;right:0;display:flex;align-items:center;gap:2px;z-index:3}
#row1{top:0;height:var(--h1);padding-left:8px}
#row2{top:var(--h1);height:var(--h2);padding:0 8px;display:none;gap:4px}
body.lay-classic #row2{display:flex}
body.lay-compact #row1,body.lay-vertical #row1{gap:4px}
.drag{flex:1 1 0;min-width:28px;align-self:stretch}
.wc{display:flex;align-self:stretch;margin-left:2px}
.wc button{width:46px;border:0;background:none;color:var(--fg2);display:grid;place-items:center;transition:background-color var(--dur-s) var(--ease),color var(--dur-s) var(--ease)}
.wc svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.wc button:hover{background:var(--hover);color:var(--fg)}.wc button.x:hover{background:#e81123;color:#fff}

/* buttons */
.ib{width:32px;height:32px;flex:none;border-radius:var(--pill);border:0;background:none;color:var(--fg2);display:grid;place-items:center;padding:0;position:relative;transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease),transform var(--dur-s) var(--ease)}
.ib:hover{background:var(--hover);color:var(--fg)}.ib:active{transform:scale(.92);background:var(--press)}
.ib:disabled{opacity:.32;pointer-events:none}
.navg{display:flex;gap:2px;flex:none}
#spbtn{height:30px;max-width:150px;flex:none;border-radius:var(--pill);border:1px solid var(--line);background:none;color:var(--fg2);display:flex;align-items:center;gap:7px;padding:0 8px 0 10px;margin-right:4px;transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease)}
#spbtn:hover{background:var(--hover);color:var(--fg)}
#spbtn i,.dot{width:10px;height:10px;border-radius:50%;flex:none}
#spbtn b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#spbtn .i{width:14px;height:14px;opacity:.7}
body.lay-compact #spbtn{width:30px;padding:0;justify-content:center}
body.lay-compact #spbtn b,body.lay-compact #spbtn .i{display:none}

/* omnibox */
#omni{flex:1 1 auto;min-width:0;height:34px;border-radius:var(--pill);background:var(--raised);border:1px solid var(--line);border-top-color:var(--hi);display:flex;align-items:center;gap:2px;padding:0 3px 0 12px;transition:background-color var(--dur) var(--ease),border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
#omni:hover{background:var(--raised-2)}
#omni:focus-within{background:var(--raised-2);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
body.lay-compact #omni{flex:0 1 clamp(220px,32vw,480px)}
body.lay-vertical #omni{max-width:880px}
#oi{color:var(--fg3);margin-right:6px;display:grid}
#oi .i{width:15px;height:15px}
#url{flex:1;min-width:0;height:100%;border:0;background:none;outline:0;color:var(--fg);font-size:13.5px;user-select:text;padding:0}
#url::placeholder{color:var(--fg3)}
#omni .ib{width:28px;height:28px}#omni .ib .i{width:15px;height:15px}
.chip{height:24px;padding:0 10px;border-radius:var(--pill);border:1px solid var(--line);background:none;font-size:12px;color:var(--fg2);display:flex;align-items:center;gap:5px;white-space:nowrap;flex:none;transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease)}
.chip:hover{background:var(--hover);color:var(--fg)}.chip:active{background:var(--press)}
.chip .i{width:13px;height:13px}
#unsplit{display:none}

/* tabs */
#tabs{display:flex;min-width:0;position:relative}
/* tabs use size containment (for the narrow-tab query), so the strip is sized from the tab count */
body:not(.lay-vertical) #tabs{flex:0 1 calc(var(--n,1) * 202px + var(--np,0) * 42px + 4px);align-items:center;gap:2px;height:100%;overflow-x:auto;overflow-y:hidden;padding:0 2px;scrollbar-width:none}
body:not(.lay-vertical) #tabs::-webkit-scrollbar{display:none}
.tab{position:relative;display:flex;align-items:center;gap:8px;height:32px;padding:0 4px 0 10px;border-radius:10px;color:var(--fg2);flex:0 1 200px;min-width:40px;container-type:inline-size;transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.tab:hover{background:var(--hover);color:var(--fg)}
.tab.active{background:var(--raised-2);color:var(--fg);box-shadow:var(--shadow-s)}
.tab.active::after{content:'';position:absolute;left:50%;bottom:2px;width:14px;height:2px;margin-left:-7px;border-radius:2px;background:var(--accent)}
.tab.insplit:not(.active){box-shadow:inset 0 0 0 1px var(--line-2)}
.tab.dragover{box-shadow:inset 0 0 0 1.5px var(--accent)}
body:not(.lay-vertical) .tab.pinned{flex:none;width:40px;padding:0;justify-content:center}
body:not(.lay-vertical) .tab.pinned .tt,body:not(.lay-vertical) .tab.pinned .tb,body:not(.lay-vertical) .tab.pinned .badge{display:none}
body:not(.lay-vertical) .tab .pn{display:none}
.tab.new{animation:tabin var(--dur) var(--ease) both}
@keyframes tabin{from{opacity:0;transform:scale(.92)}}
body.lay-vertical .tab.new{animation-name:tabinv}
@keyframes tabinv{from{opacity:0;transform:translateX(-8px)}}
.ghost{position:fixed;pointer-events:none;z-index:4;animation:tabout var(--dur) var(--ease) forwards;margin:0}
@keyframes tabout{to{opacity:0;transform:scale(.92)}}
.ic{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:600;flex:none;overflow:hidden;color:var(--fg2)}
.ic img{width:16px;height:16px}
.tab.loading .ic{border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.hib .tt,.tab.hib .ic{opacity:.5}
.badge{display:grid;color:var(--fg2)}.badge:empty{display:none}.badge .i{width:14px;height:14px}
.tb{width:22px;height:22px;flex:none;border:0;border-radius:var(--pill);background:none;color:var(--fg2);opacity:0;display:grid;place-items:center;padding:0;transition:opacity var(--dur) var(--ease),background-color var(--dur) var(--ease)}
.tb .i{width:13px;height:13px}
.tab:hover .tb,.tab.active .cl{opacity:1}.tb:hover{background:var(--press);color:var(--fg)}
.tb.pn.on{opacity:1;color:var(--fg)}
@container (max-width:92px){.tt{display:none}.tab:not(.active) .cl{display:none}}
@container (max-width:60px){.cl,.pn,.badge{display:none!important}}
#newh .i{width:17px;height:17px}

/* vertical sidebar */
#side{position:fixed;left:8px;top:var(--ct);bottom:8px;width:var(--sw);border-radius:var(--r-lg);padding:8px;display:none;flex-direction:column;gap:6px;z-index:2;box-shadow:var(--shadow-s)}
body.lay-vertical #side{display:flex}
body.lay-vertical.collapsed #side{padding:8px 6px}
body.lay-vertical #tabs{flex:1;min-height:0;flex-direction:column;gap:2px;overflow-y:auto;overflow-x:hidden;padding:1px}
body.lay-vertical .tab{flex:none;height:36px;width:100%}
body.lay-vertical .tab.active::after{left:0;top:50%;bottom:auto;width:3px;height:16px;margin:-8px 0 0}
body.lay-vertical.collapsed .tab{padding:0;justify-content:center}
.spaces{display:flex;align-items:center;gap:4px;padding:0 0 6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sp{height:28px;min-width:28px;border-radius:var(--pill);border:1px solid transparent;background:none;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 8px;overflow:hidden;white-space:nowrap;color:var(--fg2);transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease)}
.sp:hover{background:var(--hover);color:var(--fg)}
.sp.on{background:var(--raised-2);color:var(--fg);border-color:var(--line);max-width:150px}
.sp b{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.sp .i{width:14px;height:14px}
body.collapsed .spaces{flex-direction:column}
body.collapsed .sp{padding:0;width:32px}body.collapsed .sp b{display:none}
.sect{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);padding:8px 10px 3px}
body.collapsed .sect{display:none}
.divline{height:1px;background:var(--line);margin:5px 8px;flex:none}
.sbtn{display:flex;align-items:center;gap:9px;height:36px;padding:0 10px;border-radius:10px;border:0;background:none;color:var(--fg2);flex:none;transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease)}
.sbtn:hover{background:var(--hover);color:var(--fg)}
.sbtn kbd{margin-left:auto;font:11px var(--font);color:var(--fg3)}
body.collapsed .sbtn{justify-content:center;padding:0}body.collapsed .sbtn span,body.collapsed .sbtn kbd{display:none}

body.fs .row,body.fs #side{display:none}

/* split */
.dv{position:fixed;z-index:4;border-radius:4px;transition:background-color var(--dur) var(--ease)}
.dv.c{cursor:col-resize}.dv.r{cursor:row-resize}
.dv:hover,.dv.live{background:var(--accent-line)}
#dz{position:fixed;left:var(--cl);right:var(--rt);top:var(--ct);bottom:8px;display:none;z-index:5}
#dz.open{display:block;animation:fadein var(--dur) var(--ease)}
.z{position:absolute;border:1.5px dashed var(--line-2);border-radius:var(--r-lg);display:grid;place-items:center;color:var(--fg2);background:var(--hover);transition:background-color var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease);font-size:13px}
.z.over{border-color:var(--accent);border-style:solid;color:var(--fg);background:var(--accent-soft)}
.z[data-e=left]{left:12px;top:12px;bottom:12px;width:30%}.z[data-e=right]{right:12px;top:12px;bottom:12px;width:30%}
.z[data-e=top]{left:33%;right:33%;top:12px;height:40%}.z[data-e=bottom]{left:33%;right:33%;bottom:12px;height:40%}
</style></head><body class="glass lay-classic">
<div id="bg"><div id="base"></div><div id="wall" class="def"></div><video id="wallv" muted loop playsinline></video><div id="dim"></div><div id="wedges"></div><div id="tint"></div></div>
<div class="rz" data-d="n" style="top:0;left:10px;right:10px;height:4px;cursor:n-resize"></div>

<header id="row1" class="row"></header>
<div id="row2" class="row"></div>
<aside id="side" class="glass-s"></aside>
<div id="parts">
 <button class="ib" id="sidetog" title="Collapse sidebar"></button>
 <button id="spbtn" title="Spaces"><i></i><b></b></button>
 <div class="navg" id="navg"><button class="ib" id="back" title="Back"></button><button class="ib" id="fwd" title="Forward"></button><button class="ib" id="rel" title="Reload (Ctrl+R)"></button></div>
 <div id="omni"><span id="oi"></span><input id="url" placeholder="Search or enter address" spellcheck="false" autocomplete="off"><button class="chip hidden" id="zmchip" title="Reset zoom">100%</button><button class="chip" id="unsplit"></button><button class="ib" id="shbtn" title="Ad &amp; tracker blocker"></button><button class="ib" id="bmbtn" title="Bookmark this page (Ctrl+D)"></button><button class="chip" id="aibtn" title="Wisp AI (Ctrl+J)"></button></div>
 <div class="spaces" id="spaces"></div>
 <div id="tabs"></div>

</div>
<aside id="aip"></aside>

<div id="divs"></div>
<div id="findbar" class="glass-m"><span class="fi"></span><input id="fq" placeholder="Find in page" spellcheck="false"><span id="fcount"></span><button class="ib" id="fprev" title="Previous (Shift+F3)"></button><button class="ib" id="fnext" title="Next (F3)"></button><button class="ib" id="fx" title="Close (Esc)"></button></div>
<div id="sugg" class="glass-m"></div><div id="pop" class="glass-m"></div>
<div id="toasts"></div>
<div class="veil" id="spmodal"><div class="box glass-m"><h3 id="spt">New space</h3><input type="text" id="spn" placeholder="Space name" maxlength="24"><div class="sw" id="spc"></div>
<div class="row2"><button class="pbtn del" id="spdel">Delete</button><button class="pbtn" id="spcancel">Cancel</button><button class="pbtn go" id="spsave">Save</button></div></div></div>
<div class="veil" id="palm"><div class="box big glass-m"><div class="pqw"><span class="pqi"></span><input id="pq" placeholder="Type a command, tab, or address…" autocomplete="off"></div><div id="pr"></div></div></div>

<script>
const $=s=>document.querySelector(s),send=o=>window.ipc.postMessage(JSON.stringify(o));
const COLORS=['#ff6b5e','#ff9f43','#f7d154','#4cd98f','#3fc8e8','#6c8cff','#a46bff','#ff6bb5'];
let S={spaces:[],tabs:[],active:-1,split:null,divs:[],engines:[],engine:'ddg',light:false,accent:'#5e5ce6',glass:.5,nt:null,layout:'classic',glass_on:true,glass_ok:false,collapsed:false},dragId=null,editing=null,spColor=COLORS[0];
const RM=matchMedia('(prefers-reduced-motion: reduce)');
// static icons
[['#back','back'],['#fwd','fwd'],['#rel','reload'],['#newh','plus'],['#morebtn','dots'],['#sidetog','sidebar'],['#shbtn','shield'],['#bmbtn','star'],['#libx','x'],['#fprev','up'],['#fnext','down'],['#fx','x']].forEach(([s,n])=>$(s).innerHTML=ico(n));
$('#shbtn').insertAdjacentHTML('beforeend','<b id="shn"></b>');
$('#spbtn').insertAdjacentHTML('beforeend',ico('chev'));
$('#new .ni').outerHTML=ico('plus');$('#findbar .fi').outerHTML=ico('search');$('#palm .pqi').outerHTML=ico('search');
$('#unsplit').innerHTML=ico('split')+'Unsplit';$('#aibtn').innerHTML=ico('sparkle')+'AI';$('#privbadge').innerHTML=ico('private')+'Private';

// ---- layout slots: one set of controls, arranged per layout ----
const SLOTS={
 classic:{row1:['spbtn','tabs','newh','drag','privbadge','wc'],row2:['navg','omni','morebtn']},
 compact:{row1:['spbtn','navg','omni','tabs','newh','drag','morebtn','privbadge','wc']},
 vertical:{row1:['sidetog','navg','omni','drag','morebtn','privbadge','wc'],side:['spaces','tabs','new']}};
let placed='';
function place(lay){if(placed===lay)return;placed=lay;const parts=$('#parts'),focus=document.activeElement===$('#url');
 ['row1','row2','side'].forEach(r=>[...$('#'+r).children].forEach(c=>parts.appendChild(c)));
 const P=SLOTS[lay]||SLOTS.classic;for(const r in P)P[r].forEach(id=>$('#'+r).appendChild($('#'+id)));
 if(focus)$('#url').focus();tabEls.forEach(d=>d.classList.remove('new'));tabSig='';syncTabs();if(window.M5)M5.relayout()}

const XI=ico('x');
const ic=t=>{try{const u=new URL(t.url);if(u.protocol.startsWith('http'))return `<img src="${u.origin}/favicon.ico" alt="${(t.title||'•')[0].toUpperCase().replace(/[^A-Z0-9a-z•]/g,'•')}" onerror="this.parentNode.textContent=this.alt">`}catch(e){}return t.url==='wisp://newtab'?'<img src="/logo.svg" alt="">':(t.title||'•')[0].toUpperCase()};
const tabEls=new Map(),extraEls=new Map();let firstRender=true,spaceSig='',tabSig='';
function mkTab(){const d=document.createElement('div');d.draggable=true;d.className='tab'+(firstRender?'':' new');
  d.innerHTML=`<span class="ic"></span><span class="tt"></span><span class="badge"></span><button class="tb pn"></button><button class="tb cl" title="Close (Ctrl+W)">${XI}</button>`;
  d.querySelector('.pn').innerHTML=ico('pin');
  d.addEventListener('animationend',()=>d.classList.remove('new'));
  d.onclick=()=>send({t:'select',id:d._t.id});
  d.querySelector('.cl').onclick=e=>{e.stopPropagation();send({t:'close',id:d._t.id})};
  d.querySelector('.pn').onclick=e=>{e.stopPropagation();send({t:'pin',id:d._t.id})};
  d.onauxclick=e=>{if(e.button===1)send({t:'close',id:d._t.id})};
  d.onmousedown=e=>{if(e.button===1)e.preventDefault()};
  d.oncontextmenu=e=>{e.preventDefault();ctx(d._t,e.clientX,e.clientY)};
  d.ondragstart=e=>{dragId=d._t.id;e.dataTransfer.setData('text/plain',String(d._t.id));setTimeout(()=>{send({t:'drag',on:true});$('#dz').classList.add('open')},0)};
  d.ondragend=()=>{dragId=null;$('#dz').classList.remove('open');send({t:'drag',on:false})};
  d.ondragover=e=>{e.preventDefault();d.classList.add('dragover')};d.ondragleave=()=>d.classList.remove('dragover');
  d.ondrop=e=>{e.preventDefault();d.classList.remove('dragover');if(dragId!==null&&dragId!==d._t.id)send({t:'move',id:dragId,to:d._t.id})};
  return d}
// Update a tab in place (no rebuild, no animation) when its title/url/state changes.
function updTab(d,t){d._t=t;const c=d.classList,ld=!!t.loading&&t.url!=='wisp://newtab';
  c.toggle('active',t.id===S.active);c.toggle('loading',ld);c.toggle('insplit',!!(S.split&&S.split.includes(t.id)));c.toggle('hib',!!t.hib);c.toggle('pinned',!!t.pinned);
  const ik=(ld?'L|':'')+t.url.split('/').slice(0,3).join('/')+'|'+(t.title||'•')[0];if(d._ik!==ik){d._ik=ik;d.querySelector('.ic').innerHTML=ld?'':ic(t)}
  const tt=d.querySelector('.tt'),txt=t.title||'New Tab';if(tt.textContent!==txt){tt.textContent=txt;d.title=txt}
  const b=d.querySelector('.badge'),m=t.muted?'1':'';if(b.dataset.m!==m){b.dataset.m=m;b.innerHTML=t.muted?ico('muted'):''}
  const pn=d.querySelector('.pn');pn.classList.toggle('on',!!t.pinned);pn.title=t.pinned?'Unpin':'Pin'}
function secEl(k,cls,txt){let e=extraEls.get(k);if(!e){e=document.createElement('div');e.className=cls;if(txt)e.textContent=txt;extraEls.set(k,e)}return e}
const vert=()=>placed==='vertical'; // the layout on screen (a pending crossfade may not have applied S.layout yet)
function syncTabs(){const sc=$('#tabs'),pins=S.tabs.filter(t=>t.pinned),rest=S.tabs.filter(t=>!t.pinned),want=[];
  const get=t=>{let d=tabEls.get(t.id);if(!d){d=mkTab();tabEls.set(t.id,d)}updTab(d,t);return d};

   const ids=new Set(S.tabs.map(t=>t.id));
   tabEls.forEach((el,id)=>{if(!ids.has(id)){if(anim&&el.isConnected&&before.has(id))ghost(el,before.get(id));tabEls.delete(id)}});

function ghost(el,r){const g=el.cloneNode(true);g.classList.remove('new','dragover');g.classList.add('ghost');Object.assign(g.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',transform:''});
  document.body.appendChild(g);g.addEventListener('animationend',()=>g.remove());setTimeout(()=>g.remove(),400)}

function divs(){const sig=JSON.stringify(S.divs||[]);if(sig===divSig)return;divSig=sig;const c=$('#divs');c.innerHTML='';(S.divs||[]).forEach(d=>{const e=document.createElement('div');e.className='dv '+(d.col?'c':'r');

// wallpaper (drawn behind the glass; Flat hides it)
let lastWall='';
function wall(nt){const cfg=nt||{},w=cfg.wall,key=JSON.stringify([w,cfg.blur,cfg.dim]);

// Page areas ("cuts") come from Rust whenever they change: mask them out of the background with

function cuts(c){const bg=$('#bg'),W=innerWidth,H=innerHeight,R=c.radius||12,list=c.r||[],round=c.round!==false;
  if(!list.length){bg.style.webkitMaskImage=bg.style.maskImage='';$('#wedges').innerHTML='';return}
  const rr=({x,y,w,h})=>{const r=round?Math.min(R,w/2,h/2):0;return `M${x+r} ${y}H${x+w-r}A${r} ${r} 0 0 1 ${x+w} ${y+r}V${y+h-r}A${r} ${r} 0 0 1 ${x+w-r} ${y+h}H${x+r}A${r} ${r} 0 0 1 ${x} ${y+h-r}V${y+r}A${r} ${r} 0 0 1 ${x+r} ${y}Z`};
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><path fill-rule="evenodd" d="M0 0H${W}V${H}H0Z${list.map(rr).join('')}"/></svg>`;
